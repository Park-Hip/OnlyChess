# The event that proves execute must be a LIST OF STEPS: it does two unrelated
# things to two different sets of pieces.
#
# It is also F2's clearest exhibit. Step 1 respects shields; step 2 does not.
# Same event, same author, opposite answers — and until this file existed, the
# only way to know was to notice `include_shielded=True` in one call and
# `include_shielded=False` in the other.

type: event
id: base:mat_quyen_cong_dan
name: Mat Quyen Cong Dan

warning:
  message: >-
    MAT QUYEN CONG DAN INCOMING! A BLACK PAWN WILL FALL AND A WHITE PAWN WILL
    SWITCH SIDES.

execute:
  # Step 1 — one black pawn dies. Shields respected.
  - select:
      filter: { is: base:pawn, color: black, not_status: [base:shield] }
      pick: { random: 1 }
    effect: { type: destroy }
    message: { each: "x{piece}@{square}" }

  # Step 2 — one white pawn changes sides. Shields NOT respected.
  - select:
      filter: { is: base:pawn, color: white }
      pick: { random: 1 }
    # The only consumer of set_color in the game. Note what it must re-derive:
    # the pawn's `direction` is excluded from the engine's preserved-attribute
    # set, so a converted pawn faces the other way. Under the schema that falls
    # out for free — `forward` belongs to the side (board/standard.yaml), not to
    # the piece, so a colour change re-resolves it with no rule of its own.
    effect: { type: set_color, to: base:black }
    message: { each: "{piece}@{square}=bP" }

empty_message: "0x"
