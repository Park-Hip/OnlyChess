type: event
id: base:comeout
name: Comeout

warning:
  message: "COMEOUT INCOMING! A RANDOM PAWN WILL BECOME A QUEEN."

execute:
  - select:
      filter: { is: base:pawn }       # exact identity — a Warden is not a pawn
      pick: { random: 1 }
    effect:
      type: transform
      into: base:queen
      # Keeps statuses. gia_xang_tang drops them. Both policies are live today,
      # unnamed, and they disagree — naming them makes it a decision (F4).
      preserve: all_except_identity
    message: { each: "{piece}@{square}=Q" }

empty_message: "0x"
