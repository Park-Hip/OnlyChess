# Fusion by composition: a capture absorbs the captured piece's components, and the
# capturer's moves are rebuilt from everything it now contains.
#
# This replaced an explicit ordered-pair table on 2026-07-19. The table named a
# hand-authored result per pair — Rook+Bishop became a Warden, Bishop+Rook an
# Inquisitor — which meant only the six combinations someone had written down could
# fuse at all, and capture order changed the outcome. Composition fuses any pair, and
# a Rook taking a Bishop is now the same piece as a Bishop taking a Rook.
#
# What was given up is worth stating plainly, because a previous decision defended it:
# Warden's diagonal was deliberately limited to 3 squares, and no derived rule can
# express that. Under composition a rook-bishop moves as a full rook and a full bishop.
# That is a balance change, chosen knowingly, not an oversight.
#
# The four authored fused pieces still exist as content and remain placeable by any
# mod. Nothing produces them any more.

type: fusion
id: base:fusion_table

# Which captures fuse. `displacing_captures` = the capturer ended up standing on the
# captured square, which is what fusion means physically.
#
# This is what keeps bishop_snipe out: it emits a capture (`credit: self`) but the
# bishop never moves, so it does not displace and does not fuse — today's behaviour,
# preserved exactly. base:chess cannot reference base:fusion (UC11), so the ability
# could never have opted out by name; the decision has to live here.
fuses_on: displacing_captures

# Derive the result instead of looking it up. Components accumulate in capture order,
# so `components[0]` stays the original piece and every selector reading `primary`
# keeps working — a fused rook is still primarily a rook.
#
# Royalty is not absorbed. That rule lives in the engine as a property check rather
# than here as a piece id, because core naming a king would be the special-casing the
# prime directive forbids.
compose: union
