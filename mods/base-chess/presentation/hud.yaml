type: hud_layout
id: base:classic_hud
name: Classic HUD
widgets:
  - { type: turn, slot: top }
  # Declared unconditionally: the widget draws nothing when the mode has no time limit, so this
  # costs a clockless game exactly one blank line of nothing.
  - { type: clock, slot: side }
  - { type: resources, slot: side }
  - { type: log, slot: side, max_lines: 12 }
  - { type: prompt, slot: bottom }
