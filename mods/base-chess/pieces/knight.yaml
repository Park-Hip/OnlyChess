# Offsets are [forward, right] in the piece's own frame, never raw board
# coordinates. The knight's octet is symmetric, so its frame-relative offsets
# happen to equal its board-relative ones — which is exactly why it is a bad
# piece to check the convention against. See the pawn for a piece where it bites.

type: piece
id: base:knight
name: Knight
# Per-side artwork under assets/sprites/knight/base/. The glyph below stays as the
# fallback for anywhere a picture cannot be drawn.
sprite: base:knight
presentation: { glyph: N }
material: 3

moves:
  - type: leap
    offsets: [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]]
